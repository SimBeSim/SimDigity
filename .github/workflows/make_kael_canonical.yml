name: Make Kael canonical (run script)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Configure git (for automated commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git status
          git remote -v

      - name: Ensure script is executable
        run: chmod +x scripts/make_kael_canonical.py || true

      - name: Run make_kael_canonical script (with verbose)
        run: |
          set -x
          python3 scripts/make_kael_canonical.py --yes

      - name: Show git status & recent commits
        run: |
          git status --porcelain --untracked-files=all || true
          git --no-pager log -n 5 --oneline || true
